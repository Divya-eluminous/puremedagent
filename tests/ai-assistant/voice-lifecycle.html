<!doctype html>
<meta charset="utf-8">
<title>Voice lifecycle harness</title>
<style>
  body { font: 13px/1.6 Consolas, monospace; margin: 24px; color: #1a1a1a; }
  h1 { font: 600 16px/1.4 system-ui, sans-serif; margin: 0 0 4px; }
  p.lede { font: 13px/1.5 system-ui, sans-serif; color: #555; margin: 0 0 18px; max-width: 62ch; }
  .ok { color: #17692a; }
  .fail { color: #b3261e; font-weight: 700; }
  h2 { font: 600 13px/1.6 system-ui, sans-serif; margin: 16px 0 2px; color: #333; }
  #sum { margin-top: 18px; padding: 8px 12px; border-left: 3px solid #999; background: #f6f6f6; }
</style>
<h1>Voice lifecycle harness</h1>
<p class="lede">
  Drives the microphone/speech lifecycle against stubbed browser APIs, so the
  rule "never open the microphone while the assistant is talking" can be checked
  without a real microphone or a real voice. Open this file in a browser.
</p>
<div id="out"></div>
<div id="sum"></div>
<script>
var pass = 0, fail = 0;
function log(label, got, want) {
  var okay = JSON.stringify(got) === JSON.stringify(want);
  okay ? pass++ : fail++;
  var d = document.createElement('div');
  d.className = okay ? 'ok' : 'fail';
  d.textContent = (okay ? '  OK   ' : '  FAIL ') + label +
    (okay ? '' : '   got=' + JSON.stringify(got) + ' want=' + JSON.stringify(want));
  document.getElementById('out').appendChild(d);
}
function head(t) {
  var h = document.createElement('h2');
  h.textContent = t;
  document.getElementById('out').appendChild(h);
}

/* ---------- stub speechSynthesis ----------
   Utterances finish only when the test says so, so the gap between two of them
   - the moment the real bug lived in - can be held open and inspected.        */
function makeSynth() {
  var queue = [];
  return {
    speaking: false,
    pending: false,
    speak: function (u) {
      queue.push(u);
      this.pending = queue.length > 1;
      if (queue.length === 1) { this.speaking = true; u.onstart && u.onstart(); }
    },
    cancel: function () {
      queue.length = 0;
      this.speaking = false;
      this.pending = false;
    },
    /** Finish the current utterance and start the next, as a browser would. */
    finishOne: function () {
      var done = queue.shift();
      this.speaking = false;
      this.pending = false;
      done && done.onend && done.onend();
      if (queue.length) {
        this.speaking = true;
        this.pending = queue.length > 1;
        queue[0].onstart && queue[0].onstart();
      }
    },
    /** The gap a real browser leaves between utterances. */
    enterGap: function () { this.speaking = false; this.pending = queue.length > 0; },
    size: function () { return queue.length; }
  };
}

/* ---------- the module under test ----------
   voiceOutput's queue accounting and isSpeaking(), transcribed from
   resources/views/ai-assistant/index.blade.php.                              */
function makeVoiceOutput(synth, enabled) {
  var queued = 0, idleCallback = null, supported = true;

  function settle() {
    queued = Math.max(0, queued - 1);
    if (queued === 0 && idleCallback) {
      var cb = idleCallback; idleCallback = null; cb();
    }
  }
  return {
    speak: function (text) {
      if (!enabled || !supported || !text) { return; }
      var u = { onstart: null, onend: settle, onerror: settle };
      queued += 1;
      synth.speak(u);
    },
    stop: function () {
      queued = 0; idleCallback = null; synth.cancel();
    },
    isSpeaking: function () { return enabled && supported && queued > 0; },
    whenSilent: function (callback) {
      if (queued === 0) { callback(); return; }
      idleCallback = callback;
      var idleTicks = 0;
      var poll = setInterval(function () {
        if (idleCallback !== callback) { clearInterval(poll); return; }
        if (supported && (synth.speaking || synth.pending)) { idleTicks = 0; return; }
        if (++idleTicks < 3) { return; }
        clearInterval(poll); queued = 0; idleCallback = null; callback();
      }, 200);
    },
    queuedCount: function () { return queued; }
  };
}

/** The microphone side: only what the guard depends on. */
function makeMic(voiceOutput) {
  var state = { listening: false, hint: '', starts: 0, handsFree: true, busy: false, box: '', micWrote: null, sent: null, step: 'intent' };
  function startListening() {
    if (voiceOutput.isSpeaking()) { return; }          // THE GUARD
    state.listening = true; state.starts += 1; state.hint = 'Listening...';
  }
  function stopListening() {
    state.listening = false;
    if (state.micWrote !== null && state.box === state.micWrote) { state.box = ''; }
    state.micWrote = null;
    state.hint = 'Type or tap the microphone to speak.';
  }
  function resumeListening() {
    if (!state.handsFree) { return; }
    // A closed conversation does not reopen the microphone. "done" is not in
    // this list: it asks "anything else?", which expects an answer.
    if (state.step === 'closed' || state.step === 'cancelled') { return; }
    voiceOutput.whenSilent(function () {
      if (!state.handsFree || state.busy || state.listening) { return; }
      if (state.box.trim() !== '') { return; }
      startListening();
    });
  }
  function hearInterim(text) { state.box = text; state.micWrote = text; }
  function tapMic() { voiceOutput.stop(); stopListening(); startListening(); }

  /**
   * A turn being submitted, as send() does it: cancel any speech, close the
   * microphone, then the assistant replies. `keepStop` false reproduces the
   * defect - the microphone left open across the reply.
   */
  function send(payload, keepStop) {
    state.sent = payload;
    voiceOutput.stop();
    if (keepStop !== false) { stopListening(); }
    state.busy = true;
  }
  function replyDone(step) {
    state.busy = false;
    if (step) { state.step = step; }
    resumeListening();
  }

  return { state: state, startListening: startListening, stopListening: stopListening,
           resumeListening: resumeListening, hearInterim: hearInterim, tapMic: tapMic,
           send: send, replyDone: replyDone };
}

function scenario(enabled) {
  var synth = makeSynth();
  var vo = makeVoiceOutput(synth, enabled !== false);
  return { synth: synth, vo: vo, mic: makeMic(vo) };
}

head('THE REPORTED BUG: THREE MESSAGES IN A ROW');
(function () {
  var s = scenario();
  ['Starting fresh for a new patient.', "Hi, I'm your PureMed Assistant.", 'How can I help you today?']
    .forEach(function (m) { s.vo.speak(m); });
  log('three utterances are queued', s.vo.queuedCount(), 3);
  s.mic.resumeListening();
  log('the microphone stays shut while speaking', s.mic.state.listening, false);

  s.synth.finishOne();
  log('still shut after the first finishes', s.mic.state.listening, false);
  s.synth.enterGap();
  s.mic.startListening();
  log('and shut in the gap between utterances', s.mic.state.listening, false);

  s.synth.finishOne();
  s.synth.finishOne();
  log('the queue has drained', s.vo.queuedCount(), 0);
  log('only now does it open', s.mic.state.listening, true);
  log('exactly once', s.mic.state.starts, 1);
})();

head('THE onend RESTART CANNOT JUMP THE QUEUE');
(function () {
  var s = scenario();
  s.vo.speak('one'); s.vo.speak('two');
  s.mic.resumeListening();                       // the restart path
  log('refused while speaking', s.mic.state.listening, false);
  s.synth.finishOne(); s.synth.finishOne();
  log('allowed once silent', s.mic.state.listening, true);
})();

head('MUTED: NOTHING TO WAIT FOR');
(function () {
  var s = scenario(false);
  s.vo.speak('a reply nobody hears');
  log('nothing is queued when muted', s.vo.queuedCount(), 0);
  log('isSpeaking stays false', s.vo.isSpeaking(), false);
  s.mic.resumeListening();
  log('the microphone opens at once', s.mic.state.listening, true);
})();

head('TAPPING THE MICROPHONE WHILE THE ASSISTANT TALKS');
(function () {
  var s = scenario();
  s.vo.speak('a long sentence'); s.vo.speak('and another');
  log('it is speaking', s.vo.isSpeaking(), true);
  s.mic.tapMic();
  log('speech is cancelled', s.vo.queuedCount(), 0);
  log('and listening starts immediately', s.mic.state.listening, true);
})();

head('CANCELLED SPEECH DOES NOT WEDGE THE MICROPHONE');
(function () {
  var s = scenario();
  s.vo.speak('interrupted'); s.vo.stop();
  log('the queue is empty', s.vo.queuedCount(), 0);
  log('and not stuck speaking', s.vo.isSpeaking(), false);
  s.mic.resumeListening();
  log('the microphone can open again', s.mic.state.listening, true);
})();

head('A STALE INTERIM IS TAKEN BACK OUT');
(function () {
  var s = scenario();
  s.mic.startListening();
  s.mic.hearInterim('starting price for a new');
  log('the box holds the half-heard phrase', s.mic.state.box, 'starting price for a new');
  s.mic.stopListening();
  log('closing the microphone clears it', s.mic.state.box, '');
  s.mic.resumeListening();
  log('so listening reopens instead of stalling', s.mic.state.listening, true);
})();

head('TYPED TEXT IS NEVER TOUCHED');
(function () {
  var s = scenario();
  s.mic.startListening();
  s.mic.hearInterim('half heard');
  s.mic.state.box = 'my mobile is 76643421';      // the patient typed over it
  s.mic.stopListening();
  log('what was typed survives', s.mic.state.box, 'my mobile is 76643421');
  s.mic.resumeListening();
  log('and listening stays shut while it sits there', s.mic.state.listening, false);
})();

head('THE INDICATOR ONLY CLAIMS WHAT IS TRUE');
(function () {
  var s = scenario();
  s.vo.speak('talking');
  s.mic.resumeListening();
  log('no "Listening..." while speaking', s.mic.state.hint.indexOf('Listening') === 0, false);
  log('and the flag agrees', s.mic.state.listening, false);
  s.synth.finishOne();
  log('"Listening..." only once it is', s.mic.state.hint.indexOf('Listening') === 0, true);
  log('and the flag agrees', s.mic.state.listening, true);
})();

head('THE MICROPHONE TURNED OFF BY HAND STAYS OFF');
(function () {
  var s = scenario();
  s.mic.state.handsFree = false;
  s.vo.speak('a reply');
  s.synth.finishOne();
  s.mic.resumeListening();
  log('silence does not reopen it', s.mic.state.listening, false);
})();

head('SUBMITTING A TURN CLOSES THE MICROPHONE');
(function () {
  var s = scenario();
  s.mic.startListening();
  log('the microphone is open', s.mic.state.listening, true);
  var startsBefore = s.mic.state.starts;

  s.mic.send({ choice: { type: 'slot_time', value: '06:10' } });
  log('submitting closes it', s.mic.state.listening, false);

  s.vo.speak('So that is Baby-TV with Dr Albert Munnar.');
  s.vo.speak('On the 25th of August at ten past six in the morning.');
  s.vo.speak('Shall I book it?');
  log('nothing reopened during the reply', s.mic.state.starts, startsBefore);
  log('and it is still shut', s.mic.state.listening, false);
})();

head('THREE UTTERANCES, NOTHING TRANSCRIBED');
(function () {
  var s = scenario();
  s.mic.startListening();
  s.mic.send({ text: '06:10' });
  var startsBefore = s.mic.state.starts;

  s.vo.speak('one'); s.vo.speak('two'); s.vo.speak('three');
  s.mic.replyDone();                       // resumeListening waits for silence

  s.synth.finishOne();
  log('shut after the first utterance', s.mic.state.listening, false);
  s.synth.enterGap();
  log('shut in the gap', s.mic.state.listening, false);
  s.synth.finishOne();
  log('shut after the second', s.mic.state.listening, false);
  s.synth.finishOne();
  log('open only after the last', s.mic.state.listening, true);
  log('and opened exactly once', s.mic.state.starts, startsBefore + 1);
  log('with nothing captured from the assistant', s.mic.state.box, '');
})();

head('A CHIP TAP WITH THE MICROPHONE OPEN');
(function () {
  var s = scenario();
  s.mic.startListening();
  s.mic.send({ choice: { type: 'slot_time', value: '06:10' } });
  log('the chip value is what was sent', s.mic.state.sent.choice.value, '06:10');
  log('and the microphone closed', s.mic.state.listening, false);
  s.vo.speak('So that is Baby-TV.');
  log('the reply is not transcribed', s.mic.state.box, '');
})();

head('A TYPED SUBMIT KEEPS THE TEXT EXACTLY');
(function () {
  var s = scenario();
  s.mic.startListening();
  // submitTyped() reads input.value into `text` and empties the box BEFORE
  // calling send(), so the payload is already built by the time the
  // microphone is closed.
  var typed = 'my mobile is 76643421';
  s.mic.state.box = typed;
  var payload = { text: typed, source: 'text' };
  s.mic.state.box = '';
  s.mic.send(payload);
  log('the typed text survives', s.mic.state.sent.text, 'my mobile is 76643421');
  log('and the microphone closed', s.mic.state.listening, false);
})();

head('A STALE INTERIM AT SUBMIT DOES NOT REACH THE PAYLOAD');
(function () {
  var s = scenario();
  s.mic.startListening();
  s.mic.hearInterim('so that is baby TV without water');
  var payload = { choice: { type: 'slot_time', value: '06:10' } };
  s.mic.send(payload);
  log('the half-heard phrase is cleared', s.mic.state.box, '');
  log('and never became the payload', s.mic.state.sent.choice.value, '06:10');
  log('nor leaked into a text field', s.mic.state.sent.text === undefined, true);
})();

head('NEGATIVE CONTROL: WITHOUT THE CLOSE, THE ASSISTANT IS HEARD');
(function () {
  var s = scenario();
  s.mic.startListening();
  s.mic.send({ choice: { type: 'slot_time', value: '06:10' } }, false);   // no stopListening()
  log('the microphone is still open - the defect', s.mic.state.listening, true);
  // Which is exactly how the assistant's own words became an answer.
  s.mic.hearInterim('so that is baby TV without water on the 25th August');
  log('and the reply lands in the box', s.mic.state.box.length > 0, true);
})();

head('SAYING GOODBYE DOES NOT LEAVE THE MICROPHONE ON');
(function () {
  var s = scenario();
  s.mic.startListening();
  s.mic.send({ text: 'no' });                       // "anything else?" -> "no"
  var startsBefore = s.mic.state.starts;

  s.vo.speak("You're welcome, Testing. Have a great day!");
  s.mic.replyDone('closed');
  s.synth.finishOne();                              // the goodbye finishes

  log('the microphone stays shut', s.mic.state.listening, false);
  log('and was never reopened', s.mic.state.starts, startsBefore);
  log('the hint does not claim to be listening',
      s.mic.state.hint.indexOf('Listening') === 0, false);
})();

head('NOR AFTER A CANCELLATION IS CLOSED');
(function () {
  var s = scenario();
  s.mic.startListening();
  s.mic.send({ text: 'no thanks' });
  var startsBefore = s.mic.state.starts;
  s.vo.speak('Done - your appointment has been cancelled.');
  s.mic.replyDone('cancelled');
  s.synth.finishOne();
  log('the microphone stays shut', s.mic.state.listening, false);
  log('and was never reopened', s.mic.state.starts, startsBefore);
})();

head('BUT AN OPEN QUESTION STILL LISTENS');
(function () {
  var s = scenario();
  s.mic.startListening();
  s.mic.send({ text: 'yes' });
  s.vo.speak('All done! Your appointment is confirmed.');
  s.vo.speak('Is there anything else I can help you with?');
  s.mic.replyDone('done');                          // "done" asks a question
  s.synth.finishOne(); s.synth.finishOne();
  log('"done" reopens, because it asked something', s.mic.state.listening, true);

  var t = scenario();
  t.mic.startListening();
  t.mic.send({ text: '76643421' });
  t.vo.speak('Which doctor would you like to see?');
  t.mic.replyDone('doctor');
  t.synth.finishOne();
  log('and so does an ordinary step', t.mic.state.listening, true);
})();

head('AFTER GOODBYE THE BUTTON STILL WORKS');
(function () {
  var s = scenario();
  s.mic.state.step = 'closed';
  s.mic.resumeListening();
  log('nothing reopens on its own', s.mic.state.listening, false);
  // Tapping is an explicit request, and goes straight to startListening().
  s.mic.tapMic();
  log('but a tap still opens it', s.mic.state.listening, true);
})();

head('NEGATIVE CONTROL: WITHOUT THE GUARD, GOODBYE STILL LISTENS');
(function () {
  var s = scenario();
  s.mic.state.step = 'closed';
  s.vo.speak("You're welcome. Have a great day!");
  // resumeListening() without the step check is just whenSilent + open.
  s.vo.whenSilent(function () { s.mic.startListening(); });
  s.synth.finishOne();
  log('it would reopen after the goodbye', s.mic.state.listening, true);
})();

var sum = document.getElementById('sum');
sum.textContent = pass + ' passed, ' + fail + ' failed';
sum.style.borderLeftColor = fail ? '#b3261e' : '#17692a';
</script>
